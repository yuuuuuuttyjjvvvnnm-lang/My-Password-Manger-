name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # keeps the same signing key between builds so new APKs can update the old app
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vault-debug-keystore
      - name: Create Capacitor project
        run: |
          mkdir www && cp index.html www/
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7 @capgo/capacitor-native-biometric@7
          npx cap init "Secure Vault" com.myvault.app --web-dir www
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.USE_BIOMETRIC"/></manifest>#' $M
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' $M
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: secure-vault-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
